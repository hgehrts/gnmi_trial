# Device list for gnmic. Copy to config/targets.yaml, or edit the copy the
# installer places in /etc/gnmic/targets.yaml (Linux) or
# /usr/local/etc/gnmi-collector/targets.yaml (macOS).
#
# Username, password, and TLS defaults come from the settings at the top of
# install.sh. Uncomment one block per device. Remove a subscription name if
# that network OS rejects the path.
#
# Default gNMI ports:
#   Cisco IOS XE     9339
#   Cisco IOS XR     57400
#   Cisco NX-OS      50051
#   Junos            32767
#   Arista EOS       6030
#   Nokia SR OS      57400
#   Nokia SR Linux   57400
#   Huawei VRP       57400   (gNMI dial-in, not Huawei's private dial-out)

targets:
