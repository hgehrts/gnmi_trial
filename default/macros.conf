# Index and sourcetype names used by the gNMI Data and gNMI Operation
# dashboards. The Build step rewrites these in local/macros.conf when the
# form uses other names.
[gnmi_events_index]
definition = index="gnmi"
iseval = 0

[gnmi_metrics_index]
definition = index="gnmi_metrics"
iseval = 0

[gnmi_ops_index]
definition = index="gnmi_ops"
iseval = 0

[gnmi_runtime_sourcetype]
definition = sourcetype="gnmi:runtime"
iseval = 0

[gnmi_setup_sourcetype]
definition = sourcetype="gnmi:setup"
iseval = 0
