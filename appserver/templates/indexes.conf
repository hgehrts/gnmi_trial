# Copy onto the Splunk Enterprise indexer, then restart Splunk.
# One HEC token must be allowed to write to all three indexes.
# gnmi_ops (the third index) holds installer output and gnmic runtime logs.

[__SPLUNK_HEC_EVENTS_INDEX__]
coldPath = $SPLUNK_DB/__SPLUNK_HEC_EVENTS_INDEX__/colddb
homePath = $SPLUNK_DB/__SPLUNK_HEC_EVENTS_INDEX__/db
thawedPath = $SPLUNK_DB/__SPLUNK_HEC_EVENTS_INDEX__/thaweddb

[__SPLUNK_HEC_METRICS_INDEX__]
coldPath = $SPLUNK_DB/__SPLUNK_HEC_METRICS_INDEX__/colddb
datatype = metric
homePath = $SPLUNK_DB/__SPLUNK_HEC_METRICS_INDEX__/db
thawedPath = $SPLUNK_DB/__SPLUNK_HEC_METRICS_INDEX__/thaweddb

[__SPLUNK_HEC_OPS_INDEX__]
coldPath = $SPLUNK_DB/__SPLUNK_HEC_OPS_INDEX__/colddb
homePath = $SPLUNK_DB/__SPLUNK_HEC_OPS_INDEX__/db
thawedPath = $SPLUNK_DB/__SPLUNK_HEC_OPS_INDEX__/thaweddb
