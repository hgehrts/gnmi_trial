[gnmi:setup]
SHOULD_LINEMERGE = false
KV_MODE = json

[gnmi:runtime]
SHOULD_LINEMERGE = false
KV_MODE = json
EXTRACT-grpc_code = code = (?<grpc_code>[A-Za-z]+) desc =
EVAL-failure_cause = case(isnull(err), null(), match(err, "x509|certificate|tls:|first record does not look like a TLS handshake|authentication handshake failed"), "TLS mismatch: compare insecure and skip-verify with the device TLS setting", match(err, "Unauthenticated|PermissionDenied|authentication failed|invalid credentials|bad username or password"), "Credentials rejected or user not authorized for gNMI", match(err, "connection refused"), "Port closed: the device answers but gNMI is not listening on this port", match(err, "i/o timeout|context deadline exceeded|DeadlineExceeded"), "No answer: routing, ACL, firewall, or wrong address", match(err, "no route to host|network is unreachable"), "No route from the collector to the device", match(err, "Unimplemented|NotFound|InvalidArgument|not supported|unknown path"), "Device rejected the path, mode, or encoding", true(), "Other gNMI or gRPC error")

[gnmi:event]
SHOULD_LINEMERGE = false
KV_MODE = json

[gnmi:metric]
SHOULD_LINEMERGE = false
